name: Update News

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Production uses deterministic editorial enforcement. Local/manual runs
      # default to shadow mode unless this is explicitly set.
      PLAIN_ENGINE_MODE: enforce

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate editorial package
        run: python scripts/validate_package.py

      - name: Run editorial regression tests
        run: python -m pytest tests -q

      - name: Generate news
        run: python scripts/generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          PLAIN_ENGINE_MODE: enforce

      - name: Commit and push
        run: |
          git config user.name "Plain Bot"
          git config user.email "bot@plainnews.app"
          git add -A
          git diff --staged --quiet || git commit -m "Update: $(date -u '+%b %d %Y %H:%M UTC')"
          git pull --rebase
          git push
